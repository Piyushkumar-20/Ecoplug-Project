services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocpi-frontend:local
    container_name: ocpi-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s